<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ผจญภัยเมืองแห่งปัญญาประดิษฐ์ (AI Adventure)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Mali', cursive;
            margin: 0;
            overflow: hidden;
            background-color: #2b2b2b;
            touch-action: none; /* Prevent browser zooming/scrolling on touch */
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* UI Overlay Elements */
        .ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        .pointer-events-auto { pointer-events: auto; }
        
        /* Animations */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-pop { animation: pop 0.3s ease-out forwards; }
        .animate-shake { animation: shake 0.2s ease-in-out infinite; }
        
        /* Custom Scrollbar for input */
        input:focus { outline: none; border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.3); }

        /* Button Press Effect */
        .btn-press:active { transform: scale(0.95); }
    </style>
</head>
<body class="text-gray-800 select-none">

    <canvas id="gameCanvas"></canvas>

    <div id="startScreen" class="ui-layer pointer-events-auto flex flex-col items-center justify-center bg-gradient-to-b from-orange-200 to-orange-400 z-50">
        <div class="bg-white p-8 rounded-3xl shadow-xl border-4 border-orange-500 text-center max-w-md w-[90%] animate-pop">
            <h1 class="text-3xl md:text-4xl font-bold text-orange-600 mb-2">ผจญภัยเมือง</h1>
            <h2 class="text-xl md:text-2xl font-bold text-blue-500 mb-6">แห่งปัญญาประดิษฐ์ 🤖</h2>
            
            <div class="mb-4 text-left">
                <label class="block text-gray-600 font-semibold mb-1">ชื่อนักสำรวจ:</label>
                <input type="text" id="playerNameInput" value="นักสำรวจน้อย" class="w-full px-4 py-2 text-lg border-2 border-orange-300 rounded-xl text-center font-bold text-orange-600" autocomplete="off" onfocus="lockKeyboard=true" onblur="lockKeyboard=false">
            </div>

            <div class="mb-6">
                <p class="text-gray-600 font-semibold mb-2">เลือกหมวกอวตาร:</p>
                <div class="flex justify-center gap-4">
                    <button class="hat-btn text-4xl p-2 rounded-xl border-4 border-orange-500 bg-orange-100 transform transition hover:scale-110" data-hat="🤠">🤠</button>
                    <button class="hat-btn text-4xl p-2 rounded-xl border-4 border-transparent hover:bg-orange-100 transform transition hover:scale-110" data-hat="👷">👷</button>
                    <button class="hat-btn text-4xl p-2 rounded-xl border-4 border-transparent hover:bg-orange-100 transform transition hover:scale-110" data-hat="👩‍🌾">👩‍🌾</button>
                </div>
            </div>

            <button id="startBtn" class="btn-press w-full py-3 bg-gradient-to-r from-green-400 to-green-500 text-white text-2xl font-bold rounded-2xl shadow-lg border-b-4 border-green-700 hover:brightness-110 transition-all">
                ออกเดินทางกันเลย!
            </button>
        </div>
    </div>

    <div id="hud" class="ui-layer hidden flex flex-col justify-between p-4 z-10">
        <div class="flex justify-between items-start">
            <div class="bg-white/90 px-4 py-2 rounded-2xl shadow-md border-2 border-orange-300 flex flex-col pointer-events-auto">
                <span id="hudName" class="text-lg font-bold text-orange-600">นักสำรวจน้อย</span>
                <span id="hudHearts" class="text-xl">❤️❤️❤️</span>
            </div>
            <div class="bg-white/90 px-4 py-2 rounded-2xl shadow-md border-2 border-yellow-400 flex items-center pointer-events-auto">
                <span class="text-2xl mr-2">⭐</span>
                <span id="hudScore" class="text-xl font-bold text-yellow-600">0/15</span>
            </div>
        </div>
        
        <div class="absolute top-4 left-1/2 transform -translate-x-1/2 w-1/3 min-w-[200px] bg-white/80 rounded-full h-4 border-2 border-orange-300 shadow-inner">
            <div id="progressTrack" class="relative w-full h-full">
                <div id="progressAvatar" class="absolute top-1/2 transform -translate-y-1/2 -ml-3 text-2xl transition-all duration-100">🤠</div>
                <div class="absolute top-1/2 right-0 transform -translate-y-1/2 translate-x-1/2 text-2xl">🚩</div>
            </div>
        </div>
    </div>

    <div id="touchControls" class="ui-layer hidden flex justify-between items-end p-6 pb-10 z-20 pointer-events-none">
        <div class="flex gap-4 pointer-events-auto">
            <button id="btnLeft" class="w-16 h-16 bg-white/70 rounded-full flex items-center justify-center text-3xl shadow-lg active:bg-gray-300 backdrop-blur-sm">◀️</button>
            <button id="btnRight" class="w-16 h-16 bg-white/70 rounded-full flex items-center justify-center text-3xl shadow-lg active:bg-gray-300 backdrop-blur-sm">▶️</button>
        </div>
        <div class="pointer-events-auto">
            <button id="btnJump" class="w-20 h-20 bg-green-400/80 border-b-4 border-green-600 rounded-full flex items-center justify-center text-4xl shadow-lg active:mt-1 active:border-b-0 backdrop-blur-sm">⬆️</button>
        </div>
    </div>

    <div id="quizModal" class="ui-layer hidden flex items-center justify-center bg-black/60 z-40 pointer-events-auto">
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl border-4 border-blue-400 text-center max-w-lg w-[95%] animate-pop relative">
            <h2 class="text-2xl md:text-3xl font-bold text-blue-600 mb-4">AI มองเห็นอะไรในภาพนี้?</h2>
            
            <div class="bg-blue-50 w-32 h-32 mx-auto rounded-2xl border-4 border-dashed border-blue-300 flex items-center justify-center mb-6">
                <span id="quizImage" class="text-6xl drop-shadow-md">❓</span>
            </div>

            <div id="quizChoices" class="flex flex-col gap-3">
                </div>

            <div id="quizFeedback" class="absolute inset-0 bg-white/90 rounded-3xl flex items-center justify-center hidden flex-col">
                <span id="feedbackIcon" class="text-6xl mb-4">✅</span>
                <span id="feedbackText" class="text-2xl font-bold text-green-600">เก่งมาก!</span>
            </div>
        </div>
    </div>

    <div id="endScreen" class="ui-layer hidden flex items-center justify-center bg-black/80 z-50 pointer-events-auto">
        <div class="bg-white p-8 rounded-3xl text-center max-w-md w-[90%] animate-pop">
            <h1 id="endTitle" class="text-4xl font-bold mb-4">Game Over</h1>
            <p id="endDesc" class="text-xl text-gray-600 mb-6">ลองใหม่อีกครั้งนะ!</p>
            <button onclick="location.reload()" class="btn-press w-full py-3 bg-blue-500 text-white text-2xl font-bold rounded-2xl shadow-lg border-b-4 border-blue-700 hover:bg-blue-400">
                เล่นอีกครั้ง 🔄
            </button>
        </div>
    </div>

    <script>
        // --- 1. Global Variables & Setup ---
        let canvas, ctx;
        let gameState = 'start'; // start, playing, paused, gameover, victory
        let lockKeyboard = false;
        let selectedHat = '🤠';
        let playerName = '';
        
        // Input state
        const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, Space: false };
        let touchLeft = false; let touchRight = false; let touchJump = false;
        let hasTouchScreen = false;

        // Audio Context (Web Audio API)
        let actx = null;

        // --- 2. Game Content: 15 AI Image Questions (P.1 Level) ---
        const quizData = [
            { img: '🐶', ans: 'หมา', choices: ['หมา', 'แมว', 'นก'] },
            { img: '🍎', ans: 'แอปเปิ้ล', choices: ['กล้วย', 'แอปเปิ้ล', 'แตงโม'] },
            { img: '🚗', ans: 'รถยนต์', choices: ['เรือ', 'เครื่องบิน', 'รถยนต์'] },
            { img: '🌻', ans: 'ดอกทานตะวัน', choices: ['ดอกทานตะวัน', 'ต้นไม้', 'ก้อนหิน'] },
            { img: '🐟', ans: 'ปลา', choices: ['ไก่', 'ปลา', 'หมู'] },
            { img: '⚽', ans: 'ลูกฟุตบอล', choices: ['ลูกฟุตบอล', 'ตุ๊กตา', 'หนังสือ'] },
            { img: '🍓', ans: 'สตรอว์เบอร์รี', choices: ['องุ่น', 'ส้ม', 'สตรอว์เบอร์รี'] },
            { img: '🦋', ans: 'ผีเสื้อ', choices: ['มด', 'ยุง', 'ผีเสื้อ'] },
            { img: '🏠', ans: 'บ้าน', choices: ['บ้าน', 'โรงเรียน', 'วัด'] },
            { img: '🐘', ans: 'ช้าง', choices: ['ลิง', 'ช้าง', 'ม้า'] },
            { img: '🍉', ans: 'แตงโม', choices: ['แตงโม', 'มะม่วง', 'สับปะรด'] },
            { img: '🚁', ans: 'เฮลิคอปเตอร์', choices: ['จักรยาน', 'รถไฟ', 'เฮลิคอปเตอร์'] },
            { img: '🍦', ans: 'ไอศกรีม', choices: ['ขนมปัง', 'ไอศกรีม', 'นม'] },
            { img: '🐢', ans: 'เต่า', choices: ['ปู', 'กบ', 'เต่า'] },
            { img: '🌈', ans: 'รุ้งกินน้ำ', choices: ['รุ้งกินน้ำ', 'พระอาทิตย์', 'เมฆ'] }
        ];

        // --- 3. Game Objects ---
        let player = {
            x: 100, y: 0, width: 40, height: 40,
            vx: 0, vy: 0, speed: 5, jumpPower: -12, gravity: 0.5,
            hearts: 3, score: 0,
            onGround: false, jumpBuffer: 0, coyoteTime: 0,
            scaleX: 1, scaleY: 1,
            lastSafeX: 100, lastSafeY: 0
        };

        let camera = { x: 0 };
        let platforms = [];
        let mushrooms = [];
        let particles = [];
        let scenery = { clouds: [], mountainsBack: [], mountainsFront: [], cacti: [] };
        let levelWidth = 8000;
        let goalX = 0;

        // --- 4. Initialization (Hybrid Boot) ---
        function initApp() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            // Detect touch screen
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                hasTouchScreen = true;
                document.getElementById('touchControls').classList.remove('hidden');
            }

            // Bind Hat Selection
            document.querySelectorAll('.hat-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.hat-btn').forEach(b => b.classList.replace('border-orange-500', 'border-transparent'));
                    e.target.classList.replace('border-transparent', 'border-orange-500');
                    selectedHat = e.target.getAttribute('data-hat');
                    document.getElementById('progressAvatar').innerText = selectedHat;
                });
            });

            // Bind Start Button
            document.getElementById('startBtn').addEventListener('click', startGame);

            // Bind Keyboard
            window.addEventListener('keydown', (e) => {
                if(lockKeyboard) return;
                if(keys.hasOwnProperty(e.code)) keys[e.code] = true;
            });
            window.addEventListener('keyup', (e) => {
                if(lockKeyboard) return;
                if(keys.hasOwnProperty(e.code)) keys[e.code] = false;
            });

            // Bind Touch Controls (No delay)
            const bindTouch = (id, action, state) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { e.preventDefault(); if(action==='left') touchLeft=state; if(action==='right') touchRight=state; if(action==='jump') touchJump=state; });
                el.addEventListener('touchend', (e) => { e.preventDefault(); if(action==='left') touchLeft=!state; if(action==='right') touchRight=!state; if(action==='jump') touchJump=!state; });
            };
            bindTouch('btnLeft', 'left', true);
            bindTouch('btnRight', 'right', true);
            bindTouch('btnJump', 'jump', true);

            window.addEventListener('resize', resizeCanvas);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if(gameState === 'playing') {
                // Adjust ground levels if needed, but for simplicity we rely on initial generation
            }
        }

        // --- 5. Level Generation (Dynamic Bounds) ---
        function generateLevel() {
            platforms = [];
            mushrooms = [];
            scenery = { clouds: [], mountainsBack: [], mountainsFront: [], cacti: [] };
            
            const ch = canvas.height;
            const baseY = ch - 100;
            
            // Starting Platform
            platforms.push({ x: 0, y: baseY, w: 600, h: ch - baseY });
            player.y = baseY - player.height;
            player.lastSafeY = player.y;

            let currentX = 600;
            let currentQ = 0;

            // Generate map based on 15 questions
            while (currentQ < 15) {
                // Gap
                currentX += 80 + Math.random() * 100;
                
                // Platform
                let pWidth = 300 + Math.random() * 300;
                let yOffset = (Math.random() * 100) - 40; // slightly up or down
                let pY = Math.max(ch - 250, Math.min(ch - 50, baseY + yOffset));
                
                platforms.push({ x: currentX, y: pY, w: pWidth, h: ch - pY });
                
                // Add Mushroom in middle of platform
                mushrooms.push({
                    x: currentX + pWidth/2,
                    y: pY - 60,
                    w: 40, h: 40,
                    qIndex: currentQ,
                    collected: false,
                    baseY: pY - 60,
                    bobTimer: Math.random() * Math.PI * 2
                });

                // Add decoration
                if(Math.random() > 0.5) scenery.cacti.push({x: currentX + 20, y: pY - 50, size: 50});

                currentX += pWidth;
                currentQ++;
            }

            // Ending Platform & Goal
            currentX += 100;
            platforms.push({ x: currentX, y: baseY, w: 800, h: ch - baseY });
            goalX = currentX + 400;
            levelWidth = goalX + 200;

            // Generate Scenery (Parallax)
            for(let i=0; i<30; i++) {
                scenery.clouds.push({ x: Math.random() * levelWidth, y: Math.random() * (ch/2), s: 30 + Math.random()*50, speed: 0.2 + Math.random()*0.3 });
                scenery.mountainsBack.push({ x: i * 400, y: ch - 200 - Math.random()*150, w: 500, h: 400 });
                scenery.mountainsFront.push({ x: i * 300, y: ch - 150 - Math.random()*100, w: 400, h: 300 });
            }
        }

        function startGame() {
            // Init Audio Context on user gesture
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === 'suspended') actx.resume();

            playerName = document.getElementById('playerNameInput').value || "นักสำรวจน้อย";
            document.getElementById('hudName').innerText = playerName;
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            
            resizeCanvas();
            generateLevel();
            
            player.hearts = 3;
            player.score = 0;
            player.x = 100;
            player.vx = 0;
            updateHUD();

            gameState = 'playing';
            requestAnimationFrame(gameLoop);
        }

        // --- 6. Audio Synthesizer (No external files) ---
        function playSound(type) {
            if(!actx) return;
            let osc = actx.createOscillator();
            let gain = actx.createGain();
            osc.connect(gain);
            gain.connect(actx.destination);

            let now = actx.currentTime;
            
            if (type === 'jump') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'correct') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'wrong' || type === 'hurt') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'win') {
                osc.type = 'square';
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => { // C5, E5, G5, C6
                    osc.frequency.setValueAtTime(freq, now + i*0.15);
                });
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            }
        }

        // --- 7. Core Game Logic ---
        function updateHUD() {
            document.getElementById('hudHearts').innerText = '❤️'.repeat(player.hearts);
            document.getElementById('hudScore').innerText = `${player.score}/15`;
            
            // Update Mini-map
            let progressPercent = Math.min(100, Math.max(0, (player.x / goalX) * 100));
            document.getElementById('progressAvatar').style.left = `${progressPercent}%`;
        }

        function spawnParticles(x, y, color, type) {
            let count = type === 'dust' ? 5 : 20;
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * (type === 'dust' ? 4 : 10),
                    vy: (Math.random() - 0.5) * (type === 'dust' ? 2 : 10) - (type === 'dust' ? 1 : 5),
                    life: 1, color: color, type: type
                });
            }
        }

        function triggerQuiz(qIndex) {
            gameState = 'paused';
            keys.ArrowLeft = false; keys.ArrowRight = false; keys.ArrowUp = false; keys.Space = false;
            
            const q = quizData[qIndex];
            const modal = document.getElementById('quizModal');
            const choicesDiv = document.getElementById('quizChoices');
            
            document.getElementById('quizImage').innerText = q.img;
            choicesDiv.innerHTML = '';
            
            // Shuffle choices
            let shuffled = [...q.choices].sort(() => Math.random() - 0.5);
            
            let answered = false;

            shuffled.forEach(choice => {
                let btn = document.createElement('button');
                btn.className = "w-full py-3 bg-gray-100 hover:bg-blue-50 border-2 border-gray-300 rounded-xl text-xl font-bold transition-colors";
                btn.innerText = choice;
                btn.onclick = () => {
                    if(answered) return;
                    answered = true;
                    
                    const isCorrect = choice === q.ans;
                    btn.classList.remove('bg-gray-100', 'hover:bg-blue-50', 'border-gray-300');
                    
                    const feedback = document.getElementById('quizFeedback');
                    const fbIcon = document.getElementById('feedbackIcon');
                    const fbText = document.getElementById('feedbackText');
                    
                    feedback.classList.remove('hidden');

                    if(isCorrect) {
                        btn.classList.add('bg-green-400', 'text-white', 'border-green-600');
                        playSound('correct');
                        spawnParticles(player.x - camera.x + player.width/2, player.y + player.height/2, '#4ade80', 'confetti');
                        player.score++;
                        fbIcon.innerText = '✅';
                        fbText.innerText = 'เก่งมาก!';
                        fbText.className = 'text-3xl font-bold text-green-600';
                    } else {
                        btn.classList.add('bg-red-400', 'text-white', 'border-red-600', 'animate-shake');
                        playSound('wrong');
                        spawnParticles(player.x - camera.x + player.width/2, player.y + player.height/2, '#f87171', 'confetti');
                        fbIcon.innerText = '❌';
                        fbText.innerText = `เฉลยคือ: ${q.ans}`;
                        fbText.className = 'text-3xl font-bold text-red-600';
                    }

                    updateHUD();

                    // Interactive Validation Delay (1.8s)
                    setTimeout(() => {
                        feedback.classList.add('hidden');
                        modal.classList.add('hidden');
                        gameState = 'playing';
                    }, 1800);
                };
                choicesDiv.appendChild(btn);
            });

            modal.classList.remove('hidden');
        }

        function checkWinOrLose() {
            if (player.hearts <= 0) {
                gameState = 'gameover';
                document.getElementById('endTitle').innerText = "Game Over 😢";
                document.getElementById('endTitle').className = "text-4xl font-bold mb-4 text-red-500";
                document.getElementById('endDesc').innerText = "พยายามใหม่อีกครั้งนะนักสำรวจ!";
                document.getElementById('endScreen').classList.remove('hidden');
                document.getElementById('touchControls').classList.add('hidden');
            } else if (player.x > goalX) {
                gameState = 'victory';
                playSound('win');
                document.getElementById('endTitle').innerText = "ยินดีด้วย! 🎉";
                document.getElementById('endTitle').className = "text-4xl font-bold mb-4 text-green-500";
                document.getElementById('endDesc').innerText = `คุณตอบถูก ${player.score} จาก 15 ข้อ`;
                document.getElementById('endScreen').classList.remove('hidden');
                document.getElementById('touchControls').classList.add('hidden');
            }
        }

        function update() {
            if (gameState !== 'playing') return;

            // Input
            let moveDir = 0;
            if (keys.ArrowLeft || touchLeft) moveDir = -1;
            if (keys.ArrowRight || touchRight) moveDir = 1;
            
            player.vx = moveDir * player.speed;

            // Jump Buffering & Coyote Time
            if (keys.ArrowUp || keys.Space || touchJump) player.jumpBuffer = 10;
            else if (player.jumpBuffer > 0) player.jumpBuffer--;

            if (player.onGround) player.coyoteTime = 8;
            else if (player.coyoteTime > 0) player.coyoteTime--;

            if (player.jumpBuffer > 0 && player.coyoteTime > 0) {
                player.vy = player.jumpPower;
                player.jumpBuffer = 0;
                player.coyoteTime = 0;
                player.onGround = false;
                playSound('jump');
                spawnParticles(player.x - camera.x + player.width/2, player.y + player.height, '#d6d3d1', 'dust');
            }

            // Snappy Gravity
            if (player.vy > 0) player.vy += player.gravity * 1.5; // Falling faster
            else player.vy += player.gravity;

            // Limits
            if (player.vy > 15) player.vy = 15;

            // Move X
            player.x += player.vx;
            
            // Collision X (Hitbox padding: using center and offset)
            let hitboxPad = 8;
            for (let p of platforms) {
                if (player.x + player.width - hitboxPad > p.x && player.x + hitboxPad < p.x + p.w &&
                    player.y + player.height > p.y && player.y < p.y + p.h) {
                    if (player.vx > 0) player.x = p.x - player.width + hitboxPad;
                    else if (player.vx < 0) player.x = p.x + p.w - hitboxPad;
                }
            }

            // Move Y
            player.y += player.vy;
            player.onGround = false;

            // Collision Y
            for (let p of platforms) {
                if (player.x + player.width - hitboxPad > p.x && player.x + hitboxPad < p.x + p.w) {
                    // Falling onto platform
                    if (player.vy > 0 && player.y + player.height >= p.y && player.y + player.height - player.vy <= p.y + 10) {
                        player.y = p.y - player.height;
                        player.vy = 0;
                        player.onGround = true;
                        
                        // Save checkpoint if moved far enough from last safe
                        if(Math.abs(player.x - player.lastSafeX) > 100) {
                             player.lastSafeX = player.x;
                             player.lastSafeY = player.y;
                        }

                        // Squash
                        player.scaleX = 1.2; player.scaleY = 0.8;
                    }
                    // Hitting head
                    else if (player.vy < 0 && player.y <= p.y + p.h && player.y - player.vy >= p.y + p.h - 10) {
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                }
            }

            // Stretch when jumping
            if (!player.onGround && player.vy < -2) {
                player.scaleX = 0.8; player.scaleY = 1.2;
            }

            // Smooth scale reset
            player.scaleX += (1 - player.scaleX) * 0.2;
            player.scaleY += (1 - player.scaleY) * 0.2;

            // Fall off screen (Checkpoint Respawn)
            if (player.y > canvas.height) {
                player.hearts--;
                playSound('hurt');
                updateHUD();
                checkWinOrLose();
                if(gameState === 'playing') {
                    // Respawn
                    player.x = player.lastSafeX;
                    player.y = player.lastSafeY - 50;
                    player.vy = 0;
                    spawnParticles(player.x - camera.x, player.y, '#f87171', 'confetti');
                }
            }

            // Check Mushrooms
            for (let m of mushrooms) {
                if (!m.collected) {
                    m.bobTimer += 0.05;
                    m.y = m.baseY + Math.sin(m.bobTimer) * 10;

                    if (player.x + player.width > m.x && player.x < m.x + m.w &&
                        player.y + player.height > m.y && player.y < m.y + m.h) {
                        m.collected = true;
                        playSound('jump'); // pop sound
                        triggerQuiz(m.qIndex);
                    }
                }
            }

            // Camera follow
            let targetCamX = player.x - canvas.width * 0.3;
            camera.x += (targetCamX - camera.x) * 0.1;
            if (camera.x < 0) camera.x = 0;

            // Particles update
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.02;
                if(p.life <= 0) particles.splice(i, 1);
            }

            checkWinOrLose();
        }

        // --- 8. Drawing (Canvas Rendering) ---
        function draw() {
            // Background Sky Gradient
            let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#fcd34d'); // Warm Peach
            bgGradient.addColorStop(1, '#ffedd5');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun
            ctx.fillStyle = '#fb923c';
            ctx.beginPath();
            ctx.arc(canvas.width - 150, 150, 80, 0, Math.PI*2);
            ctx.fill();

            // Clouds
            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            for(let c of scenery.clouds) {
                c.x -= c.speed;
                if(c.x < -100) c.x = levelWidth;
                let screenX = c.x - camera.x * 0.1; // extreme parallax
                ctx.beginPath();
                ctx.arc(screenX, c.y, c.s, 0, Math.PI*2);
                ctx.arc(screenX + c.s*0.8, c.y - c.s*0.4, c.s*0.8, 0, Math.PI*2);
                ctx.arc(screenX + c.s*1.6, c.y, c.s*0.9, 0, Math.PI*2);
                ctx.fill();
            }

            // Mountains Back (Layer 1 Parallax)
            ctx.fillStyle = '#fca5a5'; // Light terracotta
            for(let m of scenery.mountainsBack) {
                let screenX = m.x - camera.x * 0.3;
                ctx.beginPath();
                ctx.moveTo(screenX, canvas.height);
                ctx.lineTo(screenX + m.w/2, m.y);
                ctx.lineTo(screenX + m.w, canvas.height);
                ctx.fill();
            }

            // Mountains Front (Layer 2 Parallax)
            ctx.fillStyle = '#f87171'; // Darker terracotta
            for(let m of scenery.mountainsFront) {
                let screenX = m.x - camera.x * 0.6;
                ctx.beginPath();
                ctx.moveTo(screenX, canvas.height);
                ctx.lineTo(screenX + m.w/2, m.y);
                ctx.lineTo(screenX + m.w, canvas.height);
                ctx.fill();
            }

            ctx.save();
            ctx.translate(-camera.x, 0);

            // Cacti
            ctx.font = '50px sans-serif';
            for(let c of scenery.cacti) {
                ctx.fillText('🌵', c.x, c.y + 40);
            }

            // Goal Flag
            ctx.font = '80px sans-serif';
            ctx.fillText('🚩', goalX, platforms[platforms.length-1].y - 10);

            // Platforms (Terracotta with orange grass)
            for (let p of platforms) {
                // Main Dirt
                ctx.fillStyle = '#b45309';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                // Grass edge
                ctx.fillStyle = '#ea580c';
                ctx.fillRect(p.x, p.y, p.w, 15);
                // Bridge lines pattern
                ctx.strokeStyle = '#78350f';
                ctx.lineWidth = 2;
                for(let i=0; i<p.w; i+=40) {
                    ctx.beginPath(); ctx.moveTo(p.x+i, p.y+15); ctx.lineTo(p.x+i, p.y+p.h); ctx.stroke();
                }
            }

            // Mushrooms
            for (let m of mushrooms) {
                if (!m.collected) {
                    // Glow effect
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#fef08a';
                    ctx.fillStyle = '#ef4444'; // Red cap
                    ctx.beginPath(); ctx.arc(m.x + m.w/2, m.y + m.h/2, m.w/2, Math.PI, 0); ctx.fill();
                    ctx.fillStyle = '#fef08a'; // Yellow dots
                    ctx.beginPath(); ctx.arc(m.x + 10, m.y + 15, 4, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(m.x + 30, m.y + 15, 4, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#fde047'; // Yellow stem
                    ctx.fillRect(m.x + m.w/2 - 6, m.y + m.h/2, 12, m.h/2);
                    ctx.shadowBlur = 0; // reset
                    
                    // Floating question mark
                    ctx.fillStyle = 'white';
                    ctx.font = '20px Mali';
                    ctx.fillText('?', m.x + m.w/2 - 6, m.y - 5);
                }
            }

            // Particles
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                if(p.type === 'dust') {
                    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
                } else {
                    ctx.fillRect(p.x, p.y, 6, 6);
                }
            }
            ctx.globalAlpha = 1;

            // Player (Squash & Stretch rendering)
            ctx.save();
            ctx.translate(player.x + player.width/2, player.y + player.height);
            ctx.scale(player.scaleX, player.scaleY);
            
            // Draw Avatar
            ctx.font = '40px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            // Simple bounce animation based on walk
            let walkBob = (player.vx !== 0 && player.onGround) ? Math.sin(Date.now() / 50) * 5 : 0;
            ctx.fillText(selectedHat, 0, -walkBob);
            
            ctx.restore();

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
